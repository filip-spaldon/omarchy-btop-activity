# btop Activity defaults. Use "More plugin settings > Open settings file"
# to edit your own copy. Valid saves apply immediately; no restart is needed.
# Keep each setting on one line. Omitted settings use the defaults below.

# Interval ladder, in milliseconds, that the Update interval arrows step
# through. Any whole number from 100 ms to one day can still be typed.
poll_intervals = [250, 500, 1000, 2000, 5000]

# What a left click on the bar icon does. "open" launches or focuses btop;
# "toggle" also closes existing btop windows. The popup's start action always
# opens or focuses btop, regardless of this setting.
left_click = "toggle"
